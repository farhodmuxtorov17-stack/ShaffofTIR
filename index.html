<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShaffofTIR — TIR Axborot Tizimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/pinia@2/dist/pinia.iife.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0b;--surface:#111114;--surface2:#18181c;--border:#27272a;--border2:#3f3f46;--text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--brand:#6366f1;--brand2:#818cf8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--purple:#a855f7}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}
.app-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.sidebar-logo{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo svg{width:28px;height:28px;color:var(--brand)}
.sidebar-logo span{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 10px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--brand);color:#fff;font-weight:500}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}
.main-area{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
.topbar-title{font-size:15px;font-weight:600}
.topbar-spacer{flex:1}
.content{padding:24px;flex:1;min-width:0;max-width:1920px;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:16px}
.grid{display:grid;gap:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-1px}
.stat-trend{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:#5558e9}
.btn-ghost{background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:12px}
.input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);width:100%}
.input:focus{border-color:var(--brand)}
.select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);width:100%}
.label{font-size:12px;color:var(--text3);margin-bottom:6px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:500}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500}
.badge-green{background:rgba(34,197,94,.12);color:var(--green)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-amber{background:rgba(245,158,11,.12);color:var(--amber)}
.badge-blue{background:rgba(59,130,246,.12);color:var(--blue)}
.badge-purple{background:rgba(168,85,247,.12);color:var(--purple)}
.badge-gray{background:rgba(113,113,122,.12);color:var(--text3)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:380px}
.login-title{font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:24px}
.chart-bar{display:flex;align-items:end;gap:4px;height:120px;padding:8px 0}
.chart-bar-item{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:4px;transition:height .3s;position:relative}
.chart-bar-item:hover{background:var(--brand2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:8px;overflow:hidden}
.cal-cell{background:var(--surface);min-height:80px;padding:6px;font-size:11px;position:relative}
.cal-cell:hover{background:var(--surface2)}
.cal-cell.today{border:2px solid var(--brand)}
.cal-cell.other-month{opacity:.4}
.cal-event{padding:2px 6px;border-radius:4px;font-size:10px;margin-top:2px;cursor:pointer}
.timeline-grid{display:grid;grid-template-columns:80px repeat(12,1fr);gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.timeline-header{background:var(--surface2);padding:8px;text-align:center;font-size:11px;color:var(--text3);border-bottom:1px solid var(--border)}
.timeline-label{background:var(--surface2);padding:8px;font-size:12px;font-weight:500;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.timeline-slot{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:36px;padding:2px}
.timeline-booking{background:var(--brand);color:#fff;padding:2px 4px;border-radius:4px;font-size:10px;cursor:pointer;margin:1px}
.toggle{width:36px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer;transition:.2s}
.toggle.on{background:var(--green)}
.toggle-dot{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}
.toggle.on .toggle-dot{left:18px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cam-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cam-feed{aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
.cam-feed img{width:100%;height:100%;object-fit:cover}
.cam-overlay{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.list-item:hover{background:var(--surface2)}
.list-item:last-child{border-bottom:none}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar .input,.filter-bar .select{width:auto;min-width:140px}
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .3s}
.training-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.training-card:hover{border-color:var(--brand)}
.training-img{width:100%;aspect-ratio:16/9;border-radius:8px;margin-bottom:12px;object-fit:cover}
.toast{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;z-index:200;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:200px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dropdown-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.dropdown-item:hover{background:var(--surface2)}
.dropdown-item:first-child{border-radius:10px 10px 0 0}
.dropdown-item:last-child{border-radius:0 0 10px 10px}
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.tag{display:inline-flex;padding:2px 6px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text2)}
.divider{height:1px;background:var(--border);margin:16px 0}
.scroll-x{overflow-x:auto}
@media(min-width:1400px){.content{padding:32px}.grid-4{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.app-layout{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js"></script>
</body>
</html>
