<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShaffofTIR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.prod.js"></script>
<style>
/* ── DESIGN TOKENS ── */
:root {
  --brand:      #10b981;
  --brand-d:    #059669;
  --brand-dd:   #1a5c3a;
  --brand-l:    #d1fae5;
  --brand-ll:   #f0fdf4;
  --bg:         #f7f7f8;
  --surface:    #ffffff;
  --surface2:   #f9fafb;
  --border:     #e5e7eb;
  --border2:    #d1d5db;
  --text:       #111827;
  --text2:      #6b7280;
  --text3:      #9ca3af;
  --red:        #ef4444;
  --red-l:      #fee2e2;
  --amber:      #f59e0b;
  --amber-l:    #fef3c7;
  --blue:       #3b82f6;
  --blue-l:     #dbeafe;
  --purple:     #8b5cf6;
  --purple-l:   #ede9fe;
  --sidebar-w:  240px;
  --topbar-h:   56px;
  --radius:     10px;
  --radius-lg:  14px;
  --shadow:     0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 24px rgba(0,0,0,.1);
  --transition: .15s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:      #0a0c0f;
  --surface: #111418;
  --surface2:#161b22;
  --border:  #21262d;
  --border2: #30363d;
  --text:    #f0f6fc;
  --text2:   #8b949e;
  --text3:   #6e7681;
  --brand-l: rgba(16,185,129,.15);
  --brand-ll:#0d2818;
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto;z-index:100;transition:width var(--transition)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:16px;height:16px;color:#fff}
.logo-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo-name span{color:var(--brand)}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:16px 16px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all var(--transition);position:relative}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item .badge-count{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:600}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:background var(--transition)}
.user-card:hover{background:var(--surface2)}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;flex-shrink:0}
.topbar-search{flex:1;max-width:320px;position:relative}
.topbar-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 34px;font-size:13px;color:var(--text);transition:border-color var(--transition)}
.topbar-search input:focus{border-color:var(--brand)}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.page-wrap{flex:1;overflow-y:auto;padding:20px;min-width:0}

/* ── COMMON COMPONENTS ── */
.page-header{margin-bottom:20px}
.page-header h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.page-header p{font-size:13px;color:var(--text2);margin-top:3px}
.page-actions{display:flex;align-items:center;gap:8px}
.page-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all var(--transition);cursor:pointer;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text)}.btn-secondary:hover{background:var(--surface2)}
.btn-ghost{background:transparent;color:var(--text2)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:12px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:20px;height:20px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500}
.badge-green{background:var(--brand-l);color:var(--brand-d)}
.badge-red{background:var(--red-l);color:#dc2626}
.badge-amber{background:var(--amber-l);color:#92400e}
.badge-blue{background:var(--blue-l);color:#1d4ed8}
.badge-purple{background:var(--purple-l);color:#6d28d9}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

.input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text);transition:border-color var(--transition)}
.input:focus{border-color:var(--brand)}
.select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--text)}
.label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border)}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-lg{max-width:820px}
.modal-xl{max-width:1100px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.progress-bar-wrap{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}

/* ── RANGE / TIR ── */
.range-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lane-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:all var(--transition)}
.lane-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.lane-feed{aspect-ratio:16/9;background:#0a1a14;position:relative;overflow:hidden;cursor:pointer}
.lane-feed-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lane-canvas{width:100%;height:100%}
.lane-overlay-tl{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center}
.lane-overlay-tr{position:absolute;top:8px;right:8px}
.lane-overlay-br{position:absolute;bottom:8px;right:8px;text-align:right}
.lane-overlay-bl{position:absolute;bottom:8px;left:8px}
.live-pill{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;color:#fff}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.lane-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.lane-score{background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:6px;font-size:11px}
.lane-footer{padding:12px 14px}
.lane-title{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.lane-meta{display:flex;align-items:center;justify-content:space-between}
.lane-actions{display:flex;gap:6px;padding:0 14px 12px}

/* ── SHOOTER ANIMATION ── */
.shooter-container{position:absolute;inset:0;overflow:hidden;background:#0a1a14}
.shooter-bg{position:absolute;inset:0;background:linear-gradient(180deg,#0a1a14 0%,#0d2018 50%,#091409 100%)}
.target-circle{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.shooter-figure{position:absolute;bottom:18%;transition:left .4s ease}
.bullet-hole{position:absolute;border-radius:50%;background:rgba(16,185,129,.9);box-shadow:0 0 6px rgba(16,185,129,.8);transform:translate(-50%,-50%);pointer-events:none}
.bullet-flash{position:absolute;border-radius:50%;background:rgba(255,200,50,.8);transform:translate(-50%,-50%);pointer-events:none;animation:flash-out .3s forwards}
@keyframes flash-out{0%{opacity:1;width:14px;height:14px}100%{opacity:0;width:24px;height:24px}}

/* ── CAMERAS (Security Monitor) ── */
.cam-monitor{background:#0a0c0f;border-radius:var(--radius-lg);overflow:hidden;border:1px solid #1a1a2a}
.cam-grid-4{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cam-grid-6{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cam-grid-9{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cam-cell{aspect-ratio:16/9;background:#0a0c0f;position:relative;overflow:hidden;cursor:pointer}
.cam-cell:hover .cam-overlay{opacity:1}
.cam-cell.selected{outline:2px solid var(--brand)}
.cam-feed-bg{position:absolute;inset:0}
.cam-hud-tl{position:absolute;top:6px;left:6px;font-size:9px;color:rgba(255,255,255,.7);font-family:monospace}
.cam-hud-tr{position:absolute;top:6px;right:6px}
.cam-hud-bl{position:absolute;bottom:6px;left:6px;font-size:9px;color:rgba(255,255,255,.5)}
.cam-hud-br{position:absolute;bottom:6px;right:6px;font-size:9px;color:rgba(255,255,255,.5)}
.cam-overlay{position:absolute;inset:0;background:rgba(16,185,129,.08);border:1px solid var(--brand);opacity:0;transition:opacity var(--transition);display:flex;align-items:center;justify-content:center}
.cam-scanline{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.4),transparent);animation:scan 3s linear infinite}
@keyframes scan{0%{top:0}100%{top:100%}}
.cam-offline-bg{position:absolute;inset:0;background:#080a0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cam-controls{background:#0d0f14;border-top:1px solid #1a1a2a;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.cam-layout-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;color:rgba(255,255,255,.5);background:transparent;transition:all var(--transition)}
.cam-layout-btn.active,.cam-layout-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.cam-status-bar{background:#060809;padding:6px 12px;display:flex;gap:12px;align-items:center;font-size:10px;color:rgba(255,255,255,.4);font-family:monospace}

/* ── COMPARE ── */
.compare-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.compare-target{background:#0d1a14;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;position:relative}
.compare-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare-metric{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center}
.compare-metric .val{font-size:22px;font-weight:700;letter-spacing:-.5px}
.compare-metric .key{font-size:11px;color:var(--text3);margin-top:2px}
.compare-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.compare-bar-fill{height:100%;border-radius:4px}
.winner-badge{display:inline-flex;align-items:center;gap:4px;background:var(--amber-l);color:#92400e;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}

/* ── SETTINGS ── */
.settings-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.settings-nav{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px;box-shadow:var(--shadow)}
.settings-nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;transition:all var(--transition)}
.settings-nav-item:hover{background:var(--surface2);color:var(--text)}
.settings-nav-item.active{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.settings-nav-item svg{width:16px;height:16px}
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.settings-section + .settings-section{margin-top:12px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:13px;font-weight:500}
.settings-row-desc{font-size:12px;color:var(--text2);margin-top:2px}
.toggle{width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;transition:background var(--transition);flex-shrink:0}
.toggle.on{background:var(--brand)}.toggle.off{background:var(--border2)}
.toggle-knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left var(--transition);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .toggle-knob{left:18px}.toggle.off .toggle-knob{left:2px}

/* ── MISC ── */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-state svg{width:40px;height:40px;margin:0 auto 12px;opacity:.3}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all var(--transition)}
.chip:hover,.chip.active{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
.divider{height:1px;background:var(--border);margin:16px 0}
.tag{padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

@media(max-width:1200px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .logo-name,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .user-card .user-info{display:none}
  .nav-item{justify-content:center;padding:10px}
  .settings-layout{grid-template-columns:1fr}
  .compare-split{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
  .page-wrap{padding:12px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .grid-2,.grid-3,.compare-split{grid-template-columns:1fr}
  .range-grid{grid-template-columns:1fr}
  .cam-grid-4{grid-template-columns:1fr}
  .modal{margin:8px;border-radius:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app.js?v=4"></script>
</body>
</html>
