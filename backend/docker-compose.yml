services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-shaffoftir-dev-key}
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DB_HOST=db
      - DB_NAME=shaffoftir
      - DB_USER=shaffoftir
      - DB_PASSWORD=shaffoftir_secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shaffoftir
      POSTGRES_USER: shaffoftir
      POSTGRES_PASSWORD: shaffoftir_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaffoftir"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
