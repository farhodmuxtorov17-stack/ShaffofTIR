version: "3.9"

services:
  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  ai-scoring:
    build: ./backend_fastapi
    ports:
      - "8001:8001"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shaffoftir
      POSTGRES_USER: shaffoftir
      POSTGRES_PASSWORD: shaffoftir
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaffoftir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
