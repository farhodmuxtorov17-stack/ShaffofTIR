version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - DJANGO_DEBUG=True
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    image: node:20
    ports:
      - "5173:5173"
    volumes:
      - ../:/app/frontend
    working_dir: /app/frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0"

volumes:
  sqlite_data:
